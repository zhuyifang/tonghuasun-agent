name: 发布 Agent 插件

on:
  push:
    branches: [main]
    paths:
      - fqgate/compatibility.json
  workflow_dispatch:
    inputs:
      version:
        description: 用于恢复发布的版本号；必须与兼容清单一致
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fqgate-agent-publish
  cancel-in-progress: false

jobs:
  build:
    name: 重建并核对九个插件包
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      target_commit: ${{ steps.version.outputs.target_commit }}
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: 检出发布提交
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 读取并校验版本
        id: version
        shell: pwsh
        run: |
          $compatibility = Get-Content -Raw fqgate/compatibility.json | ConvertFrom-Json
          $version = [string]$compatibility.agentVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Agent 版本无效：$version" }
          if ($env:EXPECTED_VERSION -and $env:EXPECTED_VERSION -ne $version) { throw "恢复版本与兼容清单不一致" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_commit=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: 运行测试并构建正式包
        shell: pwsh
        run: |
          npm test
          ./scripts/Build-AgentPlugins.ps1 -Release
          node scripts/release/update-agent-release-metadata.mjs --mode verify --artifacts artifacts
          python -m unittest discover -s scripts/release -p 'test_publish_agent_release.py'
      - name: 保存发行包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fqgate-agent-release-${{ steps.version.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  stage:
    name: 创建 GitHub Draft Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出发行脚本和清单
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 下载发行包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fqgate-agent-release-${{ needs.build.outputs.version }}
          path: artifacts
      - name: 上传 GitHub Release 草稿
        run: >-
          python3 scripts/release/publish_agent_release.py stage
          --version "${{ needs.build.outputs.version }}"
          --manifest "update/releases/${{ needs.build.outputs.version }}.json"
          --artifacts artifacts
          --target-commit "${{ needs.build.outputs.target_commit }}"

  publish:
    name: 正式公开 Agent Release
    needs: [build, stage]
    runs-on: ubuntu-24.04
    environment: agent-production
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 检出主分支
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 下载已校验发行包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fqgate-agent-release-${{ needs.build.outputs.version }}
          path: artifacts
      - name: 正式发布 GitHub Release
        id: release
        run: python3 scripts/release/publish_agent_release.py publish --version "${{ needs.build.outputs.version }}"
      - name: 更新稳定清单和市场入口
        env:
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        run: |
          git pull --ff-only origin main
          node scripts/release/update-agent-release-metadata.mjs --mode promote --artifacts artifacts --published-at "$PUBLISHED_AT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/stable.json "update/releases/${{ needs.build.outputs.version }}.json" .claude-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "发布 Agent 插件 ${{ needs.build.outputs.version }} 稳定版"
            git push origin HEAD:main
          fi
