name: 准备 Agent 插件发布

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本升级类型；major 也可以只是进入稳定版
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 选择 custom 时填写严格语义版本，例如 1.0.0
        required: false
        type: string
      release_notes:
        description: 更新说明，每行一条
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: fqgate-agent-prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: 生成 Agent 发布 PR
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    env:
      AGENT_RELEASE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出主分支
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: 准备 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: 计算 Agent 新版本
        id: version
        shell: pwsh
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          $arguments = @("--component", "agent", "--bump", $env:RELEASE_BUMP)
          if ($env:CUSTOM_VERSION) { $arguments += @("--custom-version", $env:CUSTOM_VERSION) }
          $version = & node scripts/release/resolve-release-version.mjs @arguments
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "计算 Agent 版本失败" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: 同步全部 Agent 版本
        shell: pwsh
        run: node scripts/release/prepare-agent-version.mjs --version "${{ steps.version.outputs.version }}"
      - name: 构建确定性发行包
        shell: pwsh
        run: ./scripts/Build-AgentPlugins.ps1 -Release
      - name: 生成候选发行清单
        shell: pwsh
        run: node scripts/release/update-agent-release-metadata.mjs --mode prepare --artifacts artifacts
      - name: 运行发布前测试
        shell: pwsh
        run: |
          npm test
          node --test examples/trading-demo/tests/submission-state.test.mjs
          $env:PYTHONPATH = (Resolve-Path sdk/python/src)
          python -m unittest discover -s sdk/python/tests -p 'test_*.py'
          python -m unittest discover -s scripts/release -p 'test_publish_agent_release.py'
      - name: 创建发布分支和 PR
        shell: pwsh
        run: |
          $branch = "release/agent-v${{ steps.version.outputs.version }}"
          git switch -c $branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "准备 Agent 插件 ${{ steps.version.outputs.version }} 发布"
          git push --set-upstream origin $branch
          gh pr create --base main --head $branch --title "准备 Agent 插件 ${{ steps.version.outputs.version }} 发布" --body "自动同步全部插件版本、更新说明、发行清单和 SHA-256。合并后将自动构建 GitHub Draft Release，并等待正式发布批准。"
          gh workflow run ci.yml --ref $branch
